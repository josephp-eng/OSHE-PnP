[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pnpslice"
version = "0.1.0"
description = "Pick-and-place 'slicer': KiCad .kicad_pcb in, oshe-pnp-job/1 job files out"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# The Qt UI arrives in a later milestone; the core and CLI stay dependency-free.
gui = ["PySide6>=6.6"]
dev = ["pytest>=7"]

[project.scripts]
pnpslice = "pnpslice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]  # tests run without installing the package first